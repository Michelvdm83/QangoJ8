<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>2-player Qango local</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    </head>
    <script>
        window.onload = () => firstLoad();
    </script>
    <body>
        <div class="rules-wrapper">
            <div class="rules-button-div">
                <button class="rules-button" onclick="toggleRules(event)">
                    show rules
                </button>
            </div>
            <div class="rules-text" id="rules-text"></div>
        </div>
        <div class="game-wrapper">
            <div id="communicationWrapper" class="communicationWrapper">
                <h2 id="communication"></h2>
                <button class="restart-button" onclick="restart()">
                    Restart
                </button>
            </div>
            <div class="boardContainer">
                <div id="board" class="board"></div>
            </div>
        </div>
        <div class="names-wrapper">
            <label for="player1Name">White Player:</label>
            <input
                type="text"
                maxlength="10"
                value="Player1"
                id="player1Name"
                onchange="setPlayerName(1, event.target.value)"
            />

            <label for="player2Name">Black Player:</label>
            <input
                type="text"
                maxlength="10"
                value="Player2"
                id="player2Name"
                onchange="setPlayerName(2, event.target.value)"
            />
        </div>
    </body>
    <script src="./qangoFunctions.js"></script>
</html>
